version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "Coho04"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    # Angular-Pakete muessen dieselbe Version haben, einzeln gebumpt bricht die App
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
    assignees:
      - "Coho04"
