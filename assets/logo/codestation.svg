<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    CodeStation — a shell prompt inside a speech bubble: a conversation that
    happens in a terminal.

    The tile is a real superellipse, generated rather than drawn by hand. The
    first version was a hand-written Bézier path that spanned 640 × 832 — a
    standing rectangle, not a square, which is why it looked squeezed in the
    Dock. It also had 192 px of side padding against 96 px top and bottom.

        |x/a|^n + |y/a|^n = 1,  a = 412,  n = 5

    n = 5 approximates Apple's continuous corner curvature. 824 of 1024 is the
    macOS convention for an app tile, leaving 100 px on every side. Sampled at
    4096 points and thinned with Ramer–Douglas–Peucker (0.12 px), which drops
    the points along the straight edges where there is no curvature to describe.

    No outline. macOS app icons have none, and the one here read as a dirty edge.

    Everything inside is centred on 512 in both axes, with 93 px between the
    contents and the bubble on all four sides:

        chevron stroke  96 / 64 = 1.5 px at 16 px
        cursor block   184 / 64 = 2.9 px
        bubble         600 / 64 = 9.4 px
  -->
